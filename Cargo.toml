[package]
name = "telemetry_lmu"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36.1", features = ["persistence"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
egui_extras = { version = "0.36.1", features = ["svg", "image"] }
egui_plot = "0.37.0"
env_logger = "0.11.11"
memmap2 = "0.9.11"
tempfile = "3.27.0"
egui_phosphor_icons = "0.5.0"
chrono = "0.4.45"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "time"] }
rfd = "0.17.2"
image = "0.25.10"
