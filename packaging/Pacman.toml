name = "telemetry_lmu"
product-name = "Telemetry LMU"
version = "0.3.0"
before-packaging-command = "./build-linux-portable.sh"
formats = ["pacman"]
out-dir = "../dist/linux"

[deb]
desktop-template = "../packaging/telemetry_lmu.desktop.hbs"

[pacman.files]
"../packaging/app_icons/16x16.png" = "usr/share/icons/hicolor/16x16/apps/telemetry_lmu.png"
"../packaging/app_icons/32x32.png" = "usr/share/icons/hicolor/32x32/apps/telemetry_lmu.png"
"../packaging/app_icons/48x48.png" = "usr/share/icons/hicolor/48x48/apps/telemetry_lmu.png"
"../packaging/app_icons/64x64.png" = "usr/share/icons/hicolor/64x64/apps/telemetry_lmu.png"
"../packaging/app_icons/128x128.png" = "usr/share/icons/hicolor/128x128/apps/telemetry_lmu.png"
"../packaging/app_icons/256x256.png" = "usr/share/icons/hicolor/256x256/apps/telemetry_lmu.png"
"../packaging/app_icons/512x512.png" = "usr/share/icons/hicolor/512x512/apps/telemetry_lmu.png"

[[binaries]]
path = "../../target/release/telemetry_lmu"
main = true
